---
# 99-Verify.yml
#
# Validação final, sem alterações à infraestrutura.
#
# Execução:
# ansible-playbook -i inventory.ini 99-Verify.yml -K

- name: Verificar os nós Docker
  hosts: docker_nodes
  become: true
  gather_facts: false

  tasks:
    - name: Verificar espaço em disco
      ansible.builtin.command:
        cmd: df -h /
      register: disk
      changed_when: false

    - name: Verificar memória
      ansible.builtin.command:
        cmd: free -h
      register: memory
      changed_when: false

    - name: Verificar Docker
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Verificar cAdvisor
      ansible.builtin.uri:
        url: "http://localhost:{{ monitoring_cadvisor_port }}/metrics"
        status_code: 200
      when: monitoring_cadvisor_enabled | bool

    - name: Verificar PDFer
      ansible.builtin.uri:
        url: http://localhost:8080/files
        status_code: 200
      when: inventory_hostname in pdfer_nodes

    - name: Mostrar resumo do nó
      ansible.builtin.debug:
        msg:
          - "Nó: {{ inventory_hostname }}"
          - "Endereço: {{ ansible_host }}"
          - "Docker: {{ docker_version.stdout }}"
          - "Disco: {{ disk.stdout_lines | last }}"
          - "Memória: {{ memory.stdout_lines[1] }}"
          - >-
            cAdvisor:
            {{
              'http://' ~ ansible_host ~ ':' ~ monitoring_cadvisor_port
              if monitoring_cadvisor_enabled | bool
              else 'desativado'
            }}
          - >-
            PDFer:
            {{
              'http://' ~ ansible_host ~ ':8080'
              if inventory_hostname in pdfer_nodes
              else 'não previsto neste nó'
            }}


- name: Verificar monitorização no controlador
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Verificar Prometheus
      ansible.builtin.uri:
        url: "http://localhost:{{ monitoring_prometheus_port }}/-/healthy"
        status_code: 200

    - name: Obter targets do Prometheus
      ansible.builtin.uri:
        url: "http://localhost:{{ monitoring_prometheus_port }}/api/v1/targets"
        status_code: 200
        return_content: true
      register: prometheus_targets

    - name: Verificar que não existem targets DOWN
      ansible.builtin.assert:
        that:
          - prometheus_targets.json.status == "success"
          - prometheus_targets.json.data.activeTargets | length > 0
          - >-
            prometheus_targets.json.data.activeTargets
            | rejectattr('health', 'equalto', 'up')
            | list
            | length == 0
        fail_msg: "Existem targets do Prometheus que não estão UP."
        success_msg: "Todos os targets do Prometheus estão UP."

    - name: Verificar Grafana
      ansible.builtin.uri:
        url: "http://localhost:{{ monitoring_grafana_port }}/api/health"
        status_code: 200
      when: monitoring_grafana_enabled | bool

    - name: Mostrar resumo final
      ansible.builtin.debug:
        msg:
          - "Prometheus: http://{{ monitoring_controller_address }}:{{ monitoring_prometheus_port }}"
          - >-
            Grafana:
            {{
              'http://' ~ monitoring_controller_address ~ ':' ~ monitoring_grafana_port
              if monitoring_grafana_enabled | bool
              else 'desativado'
            }}
          - "Targets ativos: {{ prometheus_targets.json.data.activeTargets | length }}"
          - "Validação concluída com sucesso."
